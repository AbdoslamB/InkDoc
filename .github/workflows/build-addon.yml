name: Build Enrichment Add-On

# Publishes the optional Docling code/formula recognition model.
#
# This workflow exists because the add-on previously had no publication path at
# all. scripts/build_addon.py printed a catalogue entry with a placeholder URL for
# someone to paste into app/core/addons.json by hand; nobody did, so the artifact
# was never published and the two enrichment toggles it gates could never be
# enabled. Everything here mirrors build-packs.yml -- immutability guard, derived
# asset URL, provenance attestation, and a separate job that re-downloads what the
# public release actually serves -- so the add-on ships on the same terms as a pack.
#
# The model is platform-neutral weights, not executables, so one artifact serves
# every platform and there is no build matrix.

on:
  push:
    tags:
      - "docling-addon-v*"
  workflow_dispatch:
    inputs:
      release_tag:
        description: "Release tag to publish the add-on to (e.g. docling-addon-v1)"
        required: true
        default: "docling-addon-v1"

permissions:
  contents: write
  id-token: write
  attestations: write

jobs:
  build-addon:
    name: Build and publish add-on
    runs-on: ubuntu-22.04
    steps:
      - name: Checkout repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Determine release tag
        id: tag
        shell: bash
        run: |
          set -euo pipefail
          TARGET_TAG="${{ github.event.inputs.release_tag || github.ref_name }}"
          if [ -z "$TARGET_TAG" ] || [ "$TARGET_TAG" = "main" ]; then
            echo "::error::Could not determine a release tag."
            exit 1
          fi
          case "$TARGET_TAG" in
            docling-addon-v*) ;;
            *)
              echo "::error::'${TARGET_TAG}' is not a docling-addon-v* tag."
              exit 1
              ;;
          esac
          echo "target_tag=$TARGET_TAG" >> "$GITHUB_OUTPUT"
          echo "Target release tag: $TARGET_TAG"

      # Release assets are immutable. Replacing one would leave every client that
      # already pinned its SHA-256 unable to verify the download, so a rebuild has
      # to go to a new tag. Same guard build-packs.yml applies to pack assets.
      - name: Immutability guard
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TARGET_TAG: ${{ steps.tag.outputs.target_tag }}
        run: |
          set -euo pipefail
          if gh release view "$TARGET_TAG" --json assets > existing.json 2>/dev/null; then
            if python -c 'import json,sys; sys.exit(0 if any(a["name"]=="inkdoc-addon-code_enrichment.tar.gz" for a in json.load(open("existing.json"))["assets"]) else 1)'; then
              echo "::error::${TARGET_TAG} already carries the add-on archive. Add-on assets are immutable; bump to the next tag."
              exit 1
            fi
          fi
          echo "[OK] No conflicting asset on ${TARGET_TAG}."

      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.11"

      - name: Install Docling (for its model downloader)
        run: |
          python -m pip install --upgrade pip
          python -m pip install --extra-index-url https://download.pytorch.org/whl/cpu docling

      # Fetches the weights with Docling's own tooling, packages them, and writes a
      # complete app/core/addons.json with the URL derived from the tag. The script
      # validates its own output through scripts/verify_addon_catalogue.py and exits
      # non-zero rather than emitting something the application would reject.
      - name: Build add-on archive and catalogue
        env:
          TARGET_TAG: ${{ steps.tag.outputs.target_tag }}
        run: |
          python scripts/build_addon.py \
            --release-tag "$TARGET_TAG" \
            --output-dir dist/addons

      - name: Attach add-on and catalogue to the release
        uses: softprops/action-gh-release@3bb12739c298aeb8a4eeaf626c5b8d85266b0e65 # v2
        with:
          tag_name: ${{ steps.tag.outputs.target_tag }}
          files: |
            dist/addons/inkdoc-addon-code_enrichment.tar.gz
            dist/addons/addons.json
          fail_on_unmatched_files: true

      - name: Attest add-on provenance
        uses: actions/attest-build-provenance@e8998f949152b193b063cb0ec769d69d929409be # v2
        with:
          subject-path: |
            dist/addons/inkdoc-addon-code_enrichment.tar.gz
            dist/addons/addons.json

  verify-published-addon:
    name: Verify Published Add-On Asset
    needs: [build-addon]
    runs-on: ubuntu-22.04
    permissions:
      contents: read
      attestations: read
      id-token: write
    steps:
      - name: Determine release tag
        id: tag
        shell: bash
        run: |
          TARGET_TAG="${{ github.event.inputs.release_tag || github.ref_name }}"
          echo "target_tag=$TARGET_TAG" >> "$GITHUB_OUTPUT"

      # No checkout on purpose: this job verifies what the public release actually
      # serves, fetched over the same URL the application will use. gh cannot infer
      # the repository without a git remote, so GH_REPO is set explicitly.
      - name: Download the published asset and check it against the catalogue
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
          TARGET_TAG: ${{ steps.tag.outputs.target_tag }}
        run: |
          set -euo pipefail
          mkdir -p published
          for asset in inkdoc-addon-code_enrichment.tar.gz addons.json; do
            curl --fail --location --retry 3 --retry-all-errors \
              --output "published/${asset}" \
              "https://github.com/${GITHUB_REPOSITORY}/releases/download/${TARGET_TAG}/${asset}"
          done

          # The catalogue's url must be the URL this job just fetched, and its
          # sha256 must match those bytes. This is the check that would have caught
          # a hand-pasted or stale URL.
          python - <<'PY'
          import hashlib, json, os, sys

          tag = os.environ["TARGET_TAG"]
          repo = os.environ["GITHUB_REPOSITORY"]
          entry = json.load(open("published/addons.json"))["addons"]["code_enrichment"]

          expected_url = (
              f"https://github.com/{repo}/releases/download/{tag}/"
              "inkdoc-addon-code_enrichment.tar.gz"
          )
          errors = []
          if entry["url"] != expected_url:
              errors.append(f"url is {entry['url']!r}, expected {expected_url!r}")

          blob = open("published/inkdoc-addon-code_enrichment.tar.gz", "rb").read()
          digest = hashlib.sha256(blob).hexdigest()
          if digest != entry["sha256"]:
              errors.append(f"sha256 is {entry['sha256']}, published asset hashes to {digest}")
          if len(blob) != entry["size_bytes"]:
              errors.append(f"size_bytes is {entry['size_bytes']}, published asset is {len(blob)}")
          if not entry["sha256_files"]:
              errors.append("sha256_files is empty, so extracted files could not be verified")

          for err in errors:
              print(f"[FAIL] {err}")
          if errors:
              sys.exit(1)
          print(f"[PASS] Catalogue matches the published asset: {len(blob)} bytes, "
                f"{len(entry['sha256_files'])} hashed files")
          PY

      - name: Verify GitHub build attestations
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          for asset in published/*; do
            gh attestation verify "$asset" --repo "${GITHUB_REPOSITORY}"
            echo "[PASS] Attestation verified: $(basename "$asset")"
          done
