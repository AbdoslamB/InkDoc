name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  lint-and-smoke-test:
    name: Lint & smoke test (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, macos-latest, ubuntu-22.04]

    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.2.2

      - name: Set up Python (Windows and macOS)
        if: runner.os != 'Linux'
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.4.0
        with:
          python-version: "3.11"
          cache: "pip"

      - name: Set up system Python venv (Linux)
        if: runner.os == 'Linux'
        shell: bash
        run: |
          sudo apt-get update
          sudo apt-get install -y libegl1 libxkbcommon0 libgl1 python3-venv
          /usr/bin/python3 --version
          /usr/bin/python3 -m venv --system-site-packages "$HOME/inkdoc-ci-venv"
          echo "$HOME/inkdoc-ci-venv/bin" >> "$GITHUB_PATH"
          echo "VIRTUAL_ENV=$HOME/inkdoc-ci-venv" >> "$GITHUB_ENV"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install ruff==0.16.8 pytest==9.1.1 httpx==0.28.1 httpx2==2.13.0

      - name: Lint with ruff
        run: ruff check .

      - name: Byte-compile all sources (catches syntax errors)
        run: python -m compileall -q main.py app tests examples scripts

      - name: Test docs release selector
        if: runner.os == 'Linux'
        run: node tests/docs_release_selector.test.js

      - name: Test enrichment add-on UI state machine
        if: runner.os == 'Linux'
        run: node tests/enrichment_addon_ui.test.js

      - name: Test preview word count
        if: runner.os == 'Linux'
        run: node tests/preview_word_count.test.js

      - name: Test Auto engine and missing-text check UI
        if: runner.os == 'Linux'
        run: node tests/auto_engine_ui.test.js

      - name: Test GLM-OCR UI helpers
        if: runner.os == 'Linux'
        run: node tests/glm_ocr_ui.test.js

      # installer.iss is otherwise only compiled by release.yml, after the tag is
      # pushed, so a mistake in its Pascal [Code] cost a version number. Compile
      # it here against a stand-in bundle (only the script is being checked).
      - name: Compile the Windows installer script
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          # Inno Setup 6 or 7, wherever the runner image or choco put it: 7.x
          # installs under "Inno Setup 7" (and 64-bit Program Files), so a
          # hard-coded 6.x path would fail the build the day the image moves on.
          $candidates = @(
            "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe",
            "$env:ProgramFiles\Inno Setup 6\ISCC.exe",
            "$env:ProgramFiles\Inno Setup 7\ISCC.exe",
            "${env:ProgramFiles(x86)}\Inno Setup 7\ISCC.exe"
          )
          $iscc = $candidates | Where-Object { Test-Path $_ } | Select-Object -First 1
          if (-not $iscc) {
            choco install innosetup -y --no-progress
            $iscc = $candidates | Where-Object { Test-Path $_ } | Select-Object -First 1
          }
          if (-not $iscc) {
            $iscc = Get-ChildItem $env:ProgramFiles, ${env:ProgramFiles(x86)} -Filter ISCC.exe -Recurse -Depth 2 -ErrorAction SilentlyContinue |
              Select-Object -First 1 -ExpandProperty FullName
          }
          if (-not $iscc) { Write-Error "Inno Setup compiler (ISCC.exe) not found."; exit 1 }
          Write-Host "Using $iscc"
          New-Item -ItemType Directory -Force -Path dist\inkdoc | Out-Null
          Set-Content -Path dist\inkdoc\inkdoc.exe -Value "stand-in"
          & $iscc /Q "/DMyAppVersion=0.0.0-ci" "/O$env:RUNNER_TEMP\iss-check" installer.iss
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          Remove-Item -Recurse -Force dist

      - name: Engine manifest release guard (verify zero placeholder hashes)
        run: python scripts/generate_engine_manifest.py --verify-manifest

      # Same fail-closed guard as the manifest above, for app/core/addons.json.
      # An unreleased add-on passes; a half-filled or placeholder entry does not.
      - name: Add-on catalogue guard (verify no placeholder or half-filled entries)
        run: python scripts/verify_addon_catalogue.py

      # Same guard for the GLM-OCR catalogue, with the validator the app uses.
      # Unreleased (no URLs or hashes) passes; half-filled or off-allowlist fails.
      - name: GLM-OCR catalogue guard
        run: python scripts/verify_glm_ocr_catalogue.py

      # Collect the whole suite rather than naming files. The previous step listed
      # ten files by hand and ran each as `python tests/<file>.py`, which executes
      # only the functions repeated inside that file's `if __name__ == "__main__"`
      # block. Any test not listed there ran nowhere, silently and with no warning.
      - name: Run test suite
        run: python -m pytest tests/ -q

      - name: Smoke test (CLI & headless server)
        shell: bash
        run: |
          python main.py --help
          python main.py --headless --port 13199 &
          SERVER_PID=$!
          python -c "
          import urllib.request, time
          ready = False
          for _ in range(40):
              time.sleep(0.3)
              try:
                  res = urllib.request.urlopen('http://127.0.0.1:13199/health', timeout=1.0)
                  if res.getcode() == 200:
                      print('Desktop API server healthy:', res.read().decode())
                      ready = True
                      break
              except Exception:
                  pass
          assert ready, 'Server failed to start in time'
          "
          kill $SERVER_PID
