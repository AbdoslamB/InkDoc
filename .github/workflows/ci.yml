name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  lint-and-smoke-test:
    name: Lint & smoke test (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, macos-latest, ubuntu-22.04]

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v4.2.2

      - name: Set up Python (Windows and macOS)
        if: runner.os != 'Linux'
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v5.4.0
        with:
          python-version: "3.11"
          cache: "pip"

      - name: Set up system Python venv (Linux)
        if: runner.os == 'Linux'
        shell: bash
        run: |
          sudo apt-get update
          sudo apt-get install -y libegl1 libxkbcommon0 libgl1 python3-venv
          /usr/bin/python3 --version
          /usr/bin/python3 -m venv --system-site-packages "$HOME/inkdoc-ci-venv"
          echo "$HOME/inkdoc-ci-venv/bin" >> "$GITHUB_PATH"
          echo "VIRTUAL_ENV=$HOME/inkdoc-ci-venv" >> "$GITHUB_ENV"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install ruff==0.16.8 pytest httpx httpx2

      - name: Lint with ruff
        run: ruff check .

      - name: Byte-compile all sources (catches syntax errors)
        run: python -m compileall -q main.py app tests examples scripts

      - name: Test docs release selector
        if: runner.os == 'Linux'
        run: node tests/docs_release_selector.test.js

      - name: Engine manifest release guard (verify zero placeholder hashes)
        run: python scripts/generate_engine_manifest.py --verify-manifest

      - name: Run API server integration tests
        run: python tests/test_server.py

      - name: Run Engine, Worker & Network tests
        run: |
          python tests/test_docling_worker.py
          python tests/test_pack_downloader.py
          python tests/test_url_fetcher.py

      - name: Run Update & Security tests
        run: |
          python tests/test_update_verifier.py
          python tests/test_update_manager.py
          python tests/test_update_api.py
          python tests/test_update_e2e.py
          python tests/test_optional_engine.py
          python tests/test_write_version.py

      - name: Smoke test (CLI & headless server)
        shell: bash
        run: |
          python main.py --help
          python main.py --headless --port 13199 &
          SERVER_PID=$!
          python -c "
          import urllib.request, time
          ready = False
          for _ in range(40):
              time.sleep(0.3)
              try:
                  res = urllib.request.urlopen('http://127.0.0.1:13199/health', timeout=1.0)
                  if res.getcode() == 200:
                      print('Desktop API server healthy:', res.read().decode())
                      ready = True
                      break
              except Exception:
                  pass
          assert ready, 'Server failed to start in time'
          "
          kill $SERVER_PID
