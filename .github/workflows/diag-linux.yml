name: Diagnose Linux GI

on:
  push:
    branches:
      - diag/linux-gi

permissions:
  contents: read

jobs:
  diagnose:
    runs-on: ubuntu-latest
    steps:
      - name: Set up release Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.4.0
        with:
          python-version: "3.11"

      - name: Diagnose Python GI availability
        shell: bash
        run: |
          set -o pipefail
          set +e
          tool_python=$(python --version 2>&1)
          tool_executable=$(python -c "import sys; print(sys.executable)")
          toolcache_gi=$(python -c "import gi; print(gi.__file__)" 2>&1)
          toolcache_gi_status=$?
          system_gi=$(/usr/bin/python3 -c "import gi; print(gi.__file__)" 2>&1)
          system_gi_status=$?
          {
            echo "## Linux GI diagnostic"
            echo "Runner image: ${ImageOS:-unknown} ${ImageVersion:-unknown}"
            python --version
            python -c "import sys; print(sys.executable)"
            echo "$toolcache_gi"
            echo "toolcache gi exit=$toolcache_gi_status"
            /usr/bin/python3 --version
            echo "$system_gi"
            echo "system gi exit=$system_gi_status"
          } 2>&1 | tee -a "$GITHUB_STEP_SUMMARY"
          echo "::notice title=Linux GI diagnostic::runner=${ImageOS:-unknown} ${ImageVersion:-unknown}; tool_python=$tool_python exe=$tool_executable; toolcache_gi_exit=$toolcache_gi_status output=$toolcache_gi; system_gi_exit=$system_gi_status output=$system_gi"

      - name: Diagnose shipped v1.0.1 artifact
        shell: bash
        run: |
          set -o pipefail
          curl -fsSL -o inkdoc-linux.zip https://github.com/AbdoslamB/InkDoc/releases/download/v1.0.1/inkdoc-linux.zip
          unzip -q inkdoc-linux.zip
          set +e
          inkdoc/inkdoc --selftest > selftest.log 2>&1
          selftest_status=$?
          {
            echo "## Shipped v1.0.1"
            echo "selftest exit=$selftest_status"
            echo "### selftest tail"
            tail -n 15 selftest.log
            xvfb-run -a inkdoc/inkdoc > gui.log 2>&1 &
            gui_pid=$!
            sleep 15
            if kill -0 "$gui_pid" 2>/dev/null; then
              gui_stayed_alive=yes
              echo "gui stayed alive=yes"
              kill "$gui_pid" 2>/dev/null
              wait "$gui_pid" 2>/dev/null
            else
              gui_stayed_alive=no
              wait "$gui_pid"
              echo "gui stayed alive=no exit=$?"
            fi
            echo "$gui_stayed_alive" > gui-stayed-alive.txt
            echo "### GUI traceback tail"
            tail -n 15 gui.log
          } 2>&1 | tee -a "$GITHUB_STEP_SUMMARY"
          selftest_tail=$(tail -n 15 selftest.log | tr '\n' ' ')
          gui_tail=$(tail -n 15 gui.log | tr '\n' ' ')
          gui_stayed_alive=$(cat gui-stayed-alive.txt)
          echo "::notice title=Shipped v1.0.1 Linux diagnostic::selftest_exit=$selftest_status tail=$selftest_tail; gui_stayed_alive=$gui_stayed_alive gui_tail=$gui_tail"
