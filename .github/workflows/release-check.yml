name: Release check

# Checks, whenever a release is published, that installed copies can find and download it:
# the updater's address serves a manifest for the tag that passes the app's own check, and
# every file it lists answers at the size it states (scripts/check_release.py). v1.3.0 was
# published without its manifest; this run fails, and GitHub emails the maintainer, when that
# happens again. Tags other than vX.Y.Z (packs, add-ons, GLM-OCR mirrors) are skipped.

on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      tag:
        description: "Release tag to check (e.g. v1.3.1)"
        required: true

permissions:
  contents: read

jobs:
  check:
    name: Installed copies can update
    if: ${{ !github.event.release.prerelease }}
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v4.2.2

      - name: Set up Python
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v5.4.0
        with:
          python-version: "3.14"

      - name: Install the verifier's one dependency
        # Pinned like ci.yml's tools: the check never takes whatever PyPI serves that day.
        run: python -m pip install "cryptography==49.0.0"

      - name: Check the release
        env:
          TAG: ${{ github.event.release.tag_name || inputs.tag }}
        run: python scripts/check_release.py --tag "$TAG"
