name: Release

on:
  push:
    tags:
      - "v*.*.*"
  workflow_dispatch:

permissions:
  contents: write
  id-token: write
  attestations: write

jobs:
  create-draft-release:
    name: Create Draft Release
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Check out repository for release notes
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.2.2
        with:
          fetch-depth: 0

      - name: Create Single Draft Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
        run: |
          TAG="${{ github.ref_name }}"
          echo "Checking if release or draft already exists for $TAG..."
          if gh release view "$TAG" -R "${{ github.repository }}" >/dev/null 2>&1; then
            echo "::error::A release or draft for tag '$TAG' already exists. Aborting workflow to prevent collision."
            exit 1
          fi
          PRERELEASE_FLAG=""
          if [[ "$TAG" == *-* ]]; then
            PRERELEASE_FLAG="--prerelease"
          fi
          echo "Creating single draft release for $TAG ($PRERELEASE_FLAG)..."
          gh release create "$TAG" -R "${{ github.repository }}" --draft $PRERELEASE_FLAG --title "$TAG" --generate-notes

  build:
    name: Build (${{ matrix.asset_name }})
    needs: [create-draft-release]
    if: ${{ !failure() && !cancelled() }}
    runs-on: ${{ matrix.os }}
    env:
      HAVE_SIGNING: ${{ secrets.SIGNPATH_API_TOKEN != '' }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            asset_name: windows
          - os: macos-latest
            asset_name: macos
          - os: ubuntu-22.04
            asset_name: linux

    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.2.2

      - name: Set up Python (Windows and macOS)
        if: runner.os != 'Linux'
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.4.0
        with:
          python-version: "3.11"
          cache: "pip"

      - name: Set up system Python venv (Linux)
        if: runner.os == 'Linux'
        shell: bash
        run: |
          sudo apt-get update
          sudo apt-get install -y libegl1 libxkbcommon0 libgl1 zip xvfb python3-venv python3-gi gir1.2-gtk-3.0
          sudo apt-get install -y gir1.2-webkit2-4.1 || sudo apt-get install -y gir1.2-webkit2-4.0
          /usr/bin/python3 --version
          /usr/bin/python3 -m venv --system-site-packages "$HOME/inkdoc-build-venv"
          echo "$HOME/inkdoc-build-venv/bin" >> "$GITHUB_PATH"
          echo "VIRTUAL_ENV=$HOME/inkdoc-build-venv" >> "$GITHUB_ENV"

      - name: Write version file
        shell: bash
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ] && [[ "${{ github.ref }}" != refs/tags/v* ]]; then
            python scripts/write_version.py --dispatch
          else
            python scripts/write_version.py "${{ github.ref_name }}"
          fi

      - name: Extract resolved version
        id: ver
        shell: bash
        run: |
          VERSION=$(python -c "from app._version import get_version; print(get_version())")
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "Resolved version for build and smoke test: $VERSION"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install --ignore-installed -r requirements.txt
          python -m pip install pyinstaller

      - name: Verify Linux dependency imports come from the venv
        if: runner.os == 'Linux'
        shell: bash
        run: python scripts/check_venv_imports.py

      - name: Cheap engine manifest release guard (verify existence, size, digests, README alignment)
        run: python scripts/verify_engine_manifest_guard.py --allow-empty

      - name: Build with PyInstaller (folder bundle)
        shell: bash
        run: |
          SEP="${{ runner.os == 'Windows' && ';' || ':' }}"
          ICON_OPT=""
          GI_OPT=""
          YAML_OPT=""
          if [ "${{ runner.os }}" = "Windows" ]; then
            ICON_OPT="--icon assets/logo.ico"
          elif [ "${{ runner.os }}" = "macOS" ]; then
            ICON_OPT="--icon assets/logo.icns"
          else
            ICON_OPT="--icon assets/logo.png"
            GI_OPT="--collect-all gi"
            YAML_OPT="--collect-all yaml"
          fi
          pyinstaller --noconfirm --onedir --windowed \
            --name inkdoc \
            $ICON_OPT \
            $GI_OPT \
            $YAML_OPT \
            --collect-all markitdown \
            --collect-all magika \
            --collect-all uvicorn \
            --collect-all fastapi \
            --collect-all webview \
            --collect-all cryptography \
            --collect-all pdfminer \
            --collect-all pdfplumber \
            --collect-all pypdfium2 \
            --add-data "app/ui${SEP}app/ui" \
            --add-data "assets${SEP}assets" \
            --add-data "app/core/manifest.json${SEP}app/core" \
            main.py

      - name: Build single-file .exe (Windows)
        if: runner.os == 'Windows'
        shell: bash
        run: |
          pyinstaller --noconfirm --onefile --windowed \
            --name inkdoc \
            --icon assets/logo.ico \
            --distpath dist-onefile \
            --collect-all markitdown \
            --collect-all magika \
            --collect-all uvicorn \
            --collect-all fastapi \
            --collect-all webview \
            --collect-all cryptography \
            --collect-all pdfminer \
            --collect-all pdfplumber \
            --collect-all pypdfium2 \
            --add-data "app/ui;app/ui" \
            --add-data "assets;assets" \
            --add-data "app/core/manifest.json;app/core" \
            main.py

      - name: Sign inner executables (Windows)
        if: runner.os == 'Windows' && env.HAVE_SIGNING == 'true'
        shell: pwsh
        run: |
          Write-Host "Signing inner executables before installer packaging..."
          # Ready for SignPath / Authenticode signing command when secret is set

      - name: Package (Windows zip)
        if: runner.os == 'Windows'
        shell: pwsh
        run: Compress-Archive -Path dist/inkdoc/* -DestinationPath inkdoc-windows.zip

      - name: Build installer with Inno Setup (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $iscc = "C:\Program Files (x86)\Inno Setup 6\ISCC.exe"
          if (-not (Test-Path $iscc)) {
            choco install innosetup -y
            $iscc = "C:\Program Files (x86)\Inno Setup 6\ISCC.exe"
          }
          $version = "${{ steps.ver.outputs.version }}"
          & $iscc "/DMyAppVersion=$version" installer.iss
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Sign installer (Windows)
        if: runner.os == 'Windows' && env.HAVE_SIGNING == 'true'
        shell: pwsh
        run: |
          Write-Host "Signing Inno Setup installer..."
          # Ready for SignPath / Authenticode signing command when secret is set
      - name: Trim optional Linux data files
        if: runner.os == 'Linux'
        shell: bash
        run: |
          bundle=dist/inkdoc
          echo "Linux bundle before trim: $(du -sh "$bundle" | cut -f1)"
          icons="$bundle/_internal/share/icons"
          if [ -d "$icons" ]; then
            find "$icons" -mindepth 1 -maxdepth 1 ! -name hicolor ! -name Adwaita -exec rm -rf -- {} +
          fi
          pocketsphinx="$bundle/_internal/speech_recognition/pocketsphinx-data"
          if [ -d "$pocketsphinx" ]; then
            rm -rf -- "$pocketsphinx"
          fi
          echo "Linux bundle after trim: $(du -sh "$bundle" | cut -f1)"
          echo "No shared libraries were removed."

      - name: Package (macOS / Linux)
        if: runner.os != 'Windows'
        shell: bash
        run: |
          cd dist
          if [ "${{ runner.os }}" = "macOS" ]; then
            ditto -c -k --keepParent inkdoc.app "../inkdoc-macos.zip"
          else
            zip -r "../inkdoc-${{ matrix.asset_name }}.zip" inkdoc
            echo "Linux zip size: $(wc -c < ../inkdoc-${{ matrix.asset_name }}.zip) bytes"
          fi

      - name: Stage release artifacts
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path release
          if (Test-Path "inkdoc-${{ matrix.asset_name }}.zip") { Copy-Item "inkdoc-${{ matrix.asset_name }}.zip" release/ }
          if (Test-Path "dist-onefile/inkdoc.exe") { Copy-Item "dist-onefile/inkdoc.exe" release/ }
          if (Test-Path "dist-installer/inkdoc-setup.exe") { Copy-Item "dist-installer/inkdoc-setup.exe" release/ }

      - name: Report staged artifact sizes and digests
        continue-on-error: true
        shell: pwsh
        run: |
          try {
            Write-Host "=== Staged Artifact Sizes & SHA-256 Digests (${{ matrix.asset_name }}) ==="
            $summary = @(
              "### Staged Artifacts (${{ matrix.asset_name }})",
              "",
              "| Name | Bytes | MiB |",
              "| :--- | :--- | :--- |"
            )
            $hashes = @()
            Get-ChildItem -Path release -File | ForEach-Object {
              $bytes = $_.Length
              $mib = "{0:N2}" -f ($bytes / 1MB)
              $hash = (Get-FileHash -Path $_.FullName -Algorithm SHA256).Hash.ToLower()
              Write-Host "$($_.Name): $bytes bytes | SHA-256: $hash"
              $summary += "| ``$($_.Name)`` | $bytes | $mib |"
              $hashes += "$hash  $($_.Name)"
            }
            if ($env:GITHUB_STEP_SUMMARY) {
              $summary += ""
              $summary += "<details><summary>SHA-256 Checksums</summary>"
              $summary += ""
              $summary += "``````"
              $summary += $hashes
              $summary += "``````"
              $summary += "</details>"
              $summary += ""
              $summary | Out-File -FilePath $env:GITHUB_STEP_SUMMARY -Append -Encoding utf8
            }
          } catch {
            Write-Warning "Failed to report artifact sizes: $_"
          }

      - name: Install smoke test document generators
        run: |
          pip install python-docx==1.1.2 openpyxl==3.1.5 fpdf2==2.8.2

      - name: Smoke-test Windows artifacts (installer, onefile, zip)
        if: runner.os == 'Windows'
        shell: bash
        run: |
          python scripts/smoke_test_artifact.py --artifact release/inkdoc-setup.exe --type installer --expected-version "${{ steps.ver.outputs.version }}"
          python scripts/smoke_test_artifact.py --artifact release/inkdoc.exe --type onefile --expected-version "${{ steps.ver.outputs.version }}"
          python scripts/smoke_test_artifact.py --artifact release/inkdoc-windows.zip --type zip --expected-version "${{ steps.ver.outputs.version }}"

      - name: Smoke-test macOS zip artifact
        if: runner.os == 'macOS'
        shell: bash
        run: |
          python scripts/smoke_test_artifact.py --artifact release/inkdoc-macos.zip --type zip --expected-version "${{ steps.ver.outputs.version }}"

      - name: Smoke-test Linux zip artifact
        if: runner.os == 'Linux'
        shell: bash
        run: |
          xvfb-run -a python scripts/smoke_test_artifact.py --artifact "release/inkdoc-${{ matrix.asset_name }}.zip" --type zip --expected-version "${{ steps.ver.outputs.version }}"

      - name: Enforce artifact size limits
        shell: pwsh
        run: |
          $limits = @{
            "inkdoc-linux.zip" = @{ Baseline = 155103378; Cap = 162858546 }
            "inkdoc-macos.zip" = @{ Baseline = 115454850; Cap = 121227592 }
            "inkdoc-windows.zip" = @{ Baseline = 120987267; Cap = 127036630 }
            "inkdoc.exe" = @{ Baseline = 118264589; Cap = 124177818 }
            "inkdoc-setup.exe" = @{ Baseline = 91294064; Cap = 95858767 }
          }
          if ($env:RUNNER_OS -eq "Linux") {
            $names = @("inkdoc-linux.zip")
          } elseif ($env:RUNNER_OS -eq "macOS") {
            $names = @("inkdoc-macos.zip")
          } else {
            $names = @("inkdoc-windows.zip", "inkdoc.exe", "inkdoc-setup.exe")
          }
          foreach ($name in $names) {
            $path = Join-Path "release" $name
            $bytes = (Get-Item $path).Length
            $baseline = $limits[$name].Baseline
            $cap = $limits[$name].Cap
            $change = (($bytes - $baseline) / $baseline) * 100
            Write-Host ("{0}: {1} bytes; change vs v1.0.1 baseline: {2:N2}%; cap: {3} bytes" -f $name, $bytes, $change, $cap)
            if ($bytes -gt $cap) {
              Write-Error "$name exceeds its size cap of $cap bytes."
              exit 1
            }
          }

      - name: Report Linux bundle size diagnostics
        if: runner.os == 'Linux'
        shell: bash
        run: |
          mkdir -p smoke-logs
          report=smoke-logs/linux-bundle-size.txt
          {
            echo "Linux bundle size diagnostics"
            echo "=== 40 largest files/directories in dist/inkdoc ==="
            du -ah dist/inkdoc | sort -rh > /tmp/du.txt || true
            head -40 /tmp/du.txt || true
            echo "=== Selected top-level bundle directories/files ==="
            find dist/inkdoc -maxdepth 2 \( -path '*/_internal/gi*' -o -path '*/_internal/gi_repository' -o -path '*/_internal/typelibs' -o -path '*/_internal/webkit*' -o -path '*/_internal/gtk*' -o -path '*/_internal/libicu*' -o -path '*/_internal/libLLVM*' -o -path '*/_internal/onnx*' -o -path '*/_internal/torch*' -o -path '*/_internal/cuda*' \) -print0 | xargs -0 -r du -sh
          } > "$report" || true
          cat "$report" || true
          if [ -n "${GITHUB_STEP_SUMMARY:-}" ]; then
            {
              echo "### Linux bundle size diagnostics"
              echo
              echo '```text'
              cat "$report"
              echo '```'
            } >> "$GITHUB_STEP_SUMMARY"
          fi

      - name: Upload smoke test logs
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: smoke-logs-${{ matrix.asset_name }}
          path: smoke-logs/*
          if-no-files-found: ignore

      - name: Generate SHA-256 checksums
        shell: pwsh
        working-directory: release
        run: |
          Get-ChildItem -File | Where-Object { $_.Name -notlike "SHA256SUMS*" } | ForEach-Object {
            $hash = (Get-FileHash -Path $_.FullName -Algorithm SHA256).Hash.ToLower()
            "$hash  $($_.Name)"
          } | Set-Content -Encoding ascii -Path "SHA256SUMS-${{ matrix.asset_name }}.txt"

      - name: Attest build provenance
        uses: actions/attest-build-provenance@e8998f949152b193b063cb0ec769d69d929409be # v2.2.0
        with:
          subject-path: release/*

      - name: Upload build artifacts (workflow_dispatch or tag)
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: inkdoc-build-${{ matrix.asset_name }}
          path: release/*

      - name: Upload artifacts to GitHub Draft Release
        if: startsWith(github.ref, 'refs/tags/v')
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
        run: |
          TAG="${{ github.ref_name }}"
          echo "Verifying that release '$TAG' is still a draft before uploading..."
          IS_DRAFT=$(gh release view "$TAG" -R "${{ github.repository }}" --json isDraft -q .isDraft)
          if [ "$IS_DRAFT" != "true" ]; then
            echo "::error::Release '$TAG' is not a draft (isDraft=$IS_DRAFT). Refusing to upload or clobber."
            exit 1
          fi
          echo "Uploading release artifacts to draft release $TAG..."
          gh release upload "$TAG" -R "${{ github.repository }}" release/* --clobber

  publish-release:
    name: Publish Release
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [build]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Verify draft release assets
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
        run: |
          TAG="${{ github.ref_name }}"
          assets=$(gh release view "$TAG" -R "${{ github.repository }}" --json assets -q '.assets[].name')
          for required in inkdoc-setup.exe inkdoc.exe inkdoc-windows.zip inkdoc-macos.zip inkdoc-linux.zip; do
            if ! printf '%s\n' "$assets" | grep -Fxq "$required"; then
              echo "::error::Draft release '$TAG' is missing required asset: $required"
              exit 1
            fi
          done
          echo "All required draft release assets are present."

      - name: Publish GitHub Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
        run: |
          TAG="${{ github.ref_name }}"
          if [[ "$TAG" == *-* ]]; then
            echo "Publishing pre-release: $TAG"
            gh release edit "$TAG" -R "${{ github.repository }}" --draft=false --prerelease
          else
            echo "Publishing stable release: $TAG with --latest=true"
            gh release edit "$TAG" -R "${{ github.repository }}" --draft=false --prerelease=false --latest=true
          fi
          gh release view "$TAG" -R "${{ github.repository }}" --json isDraft,isPrerelease,assets
