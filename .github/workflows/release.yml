name: Release

on:
  push:
    tags:
      - "v*.*.*"
  workflow_dispatch:

permissions:
  contents: write
  id-token: write
  attestations: write

jobs:
  create-draft-release:
    name: Create Draft Release
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Check out repository for release notes
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.2.2
        with:
          fetch-depth: 0

      - name: Create Single Draft Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
          # An environment variable, never pasted into the script: a tag name
          # may contain $( ) or backticks.
          TAG: ${{ github.ref_name }}
        run: |
          echo "Checking if release or draft already exists for $TAG..."
          if gh release view "$TAG" -R "$GH_REPO" >/dev/null 2>&1; then
            echo "::error::A release or draft for tag '$TAG' already exists. Aborting workflow to prevent collision."
            exit 1
          fi
          PRERELEASE_FLAG=""
          if [[ "$TAG" == *-* ]]; then
            PRERELEASE_FLAG="--prerelease"
          fi
          # The notes are the CHANGELOG's section for this version: the app shows
          # them under Settings -> Updates (sign_manifest.py signs the same text).
          # GitHub's generated notes are only a fallback; without pull requests
          # they are little more than a link.
          NOTES_FILE="$RUNNER_TEMP/release-notes.md"
          if python3 scripts/changelog_notes.py "$TAG" > "$NOTES_FILE"; then
            NOTES_ARGS=(--notes-file "$NOTES_FILE")
          else
            echo "::warning::CHANGELOG.md has no section for $TAG; using GitHub's generated notes."
            NOTES_ARGS=(--generate-notes)
          fi
          echo "Creating single draft release for $TAG ($PRERELEASE_FLAG)..."
          gh release create "$TAG" -R "$GH_REPO" --draft $PRERELEASE_FLAG --title "$TAG" "${NOTES_ARGS[@]}"

  build:
    name: Build (${{ matrix.asset_name }})
    needs: [create-draft-release]
    if: ${{ !failure() && !cancelled() }}
    runs-on: ${{ matrix.os }}
    outputs:
      version: ${{ steps.ver.outputs.version }}
    env:
      HAVE_SIGNING: ${{ secrets.SIGNPATH_API_TOKEN != '' }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            asset_name: windows
          - os: macos-latest
            asset_name: macos
          # The Linux build host sets the oldest glibc the AppImage runs on (2.39 here);
          # scripts/sign_manifest.py's MIN_GLIBC must name the same version.
          - os: ubuntu-24.04
            asset_name: linux

    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.2.2

      # The interpreter that ships inside every bundle. Move to the next minor version
      # each autumn, while the current one still gets binary releases: "3.11" stayed on
      # 3.11.9 (April 2024) because later 3.11 security fixes were source-only.
      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.4.0
        with:
          python-version: "3.14"
          cache: "pip"

      # Linux: the window is the user's own WebKit2GTK, so the bundle carries only
      # PyGObject's Python side, built here against 24.04's GLib, and
      # scripts/linux_host_libs.py removes the GTK stack PyInstaller collects.
      # xvfb, x11-apps (xwd) and dbus-daemon (dbus-run-session) are for the GUI smoke test.
      - name: Set up the Linux build (GTK headers, venv)
        if: runner.os == 'Linux'
        shell: bash
        run: |
          sudo apt-get update
          sudo apt-get install -y libgirepository-2.0-dev libcairo2-dev pkg-config \
            gir1.2-gtk-3.0 gir1.2-webkit2-4.1 libegl1 libxkbcommon0 libgl1 xvfb x11-apps dbus-daemon
          python -m venv "$HOME/inkdoc-build-venv"
          echo "$HOME/inkdoc-build-venv/bin" >> "$GITHUB_PATH"
          echo "VIRTUAL_ENV=$HOME/inkdoc-build-venv" >> "$GITHUB_ENV"

      - name: Write version file
        shell: bash
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ] && [[ "${{ github.ref }}" != refs/tags/v* ]]; then
            python scripts/write_version.py --dispatch
          else
            python scripts/write_version.py "${{ github.ref_name }}"
          fi

      - name: Extract resolved version
        id: ver
        shell: bash
        run: |
          VERSION=$(python -c "from app._version import get_version; print(get_version())")
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "Resolved version for build and smoke test: $VERSION"

      - name: Install dependencies
        shell: bash
        run: |
          python -m pip install --upgrade pip
          python -m pip install --ignore-installed -r requirements.txt
          python -m pip install pyinstaller
          if [ "${{ runner.os }}" = "Linux" ]; then
            # PyGObject is compiled here against the runner's GLib (3.52+ needs GLib 2.80).
            # Every file is hash-pinned, and --no-build-isolation keeps pip from fetching
            # build tools of its own: hence three passes (scripts/linux-gtk/).
            python -m pip install --require-hashes --no-deps --only-binary :all: -r scripts/linux-gtk/build-tools.txt
            python -m pip install --require-hashes --no-deps --no-build-isolation -r scripts/linux-gtk/pycairo.txt
            python -m pip install --require-hashes --no-deps --no-build-isolation -r scripts/linux-gtk/pygobject.txt
          fi

      - name: Record the bundled interpreter
        shell: bash
        run: |
          python -VV
          echo "Bundled Python (${{ matrix.asset_name }}): $(python -VV)" >> "$GITHUB_STEP_SUMMARY"

      - name: Verify Linux dependency imports come from the venv
        if: runner.os == 'Linux'
        shell: bash
        run: python scripts/check_venv_imports.py

      # --allow-empty is deliberately NOT passed. It existed for the window before the
      # first engine pack was built, and it is what let v1.0.2 ship an empty manifest:
      # the flag suppresses both the "no supported_platforms" error and the check that
      # every platform the README advertises has a manifest entry. app/core/manifest.json
      # now carries docling-pack-v2, so the guard must be allowed to do its job.
      - name: Cheap engine manifest release guard (verify existence, size, digests, README alignment)
        run: python scripts/verify_engine_manifest_guard.py

      - name: Build with PyInstaller (folder bundle)
        shell: bash
        run: |
          SEP="${{ runner.os == 'Windows' && ';' || ':' }}"
          ICON_OPT=""
          GI_OPT=""
          YAML_OPT=""
          if [ "${{ runner.os }}" = "Windows" ]; then
            ICON_OPT="--icon assets/logo.ico"
          elif [ "${{ runner.os }}" = "macOS" ]; then
            ICON_OPT="--icon assets/logo.icns"
          else
            ICON_OPT="--icon assets/logo.png"
            # gi's Python package only. Excluding the gi.repository modules keeps their
            # typelibs, GTK data and runtime hooks (GTK_PATH, GIO_MODULE_DIR...) out of the
            # bundle: at run time gi loads the host's typelibs (app/core/linux_host.py).
            GI_OPT="--collect-all gi"
            for m in Gtk Gdk GdkPixbuf GdkX11 GLib GObject Gio GModule Pango PangoCairo cairo Atk \
                     HarfBuzz xlib freetype2 Soup WebKit2 JavaScriptCore Gst GstAudio GstVideo \
                     GstBase GstController GstPbutils; do
              GI_OPT="$GI_OPT --exclude-module gi.repository.$m"
            done
            # pycairo is only needed to compile PyGObject; keep it (and its licence) out.
            GI_OPT="$GI_OPT --exclude-module cairo"
            YAML_OPT="--collect-all yaml"
          fi
          # --noupx: runners have no UPX today, but if one ever appears on PATH,
          # compressed DLLs must be unpacked in memory at every launch and trip AV
          # heuristics -- both cost startup time.
          pyinstaller --noconfirm --onedir --windowed --noupx \
            --name inkdoc \
            $ICON_OPT \
            $GI_OPT \
            $YAML_OPT \
            --collect-all markitdown \
            --collect-all magika \
            --collect-all uvicorn \
            --collect-all fastapi \
            --collect-all webview \
            --collect-all cryptography \
            --collect-all pdfminer \
            --collect-all pdfplumber \
            --collect-all pypdfium2 \
            --collect-data certifi \
            --add-data "app/ui${SEP}app/ui" \
            --add-data "assets${SEP}assets" \
            --add-data "app/core/manifest.json${SEP}app/core" \
            --add-data "app/core/addons.json${SEP}app/core" \
            --add-data "app/core/glm_ocr_catalogue.json${SEP}app/core" \
            --add-data "app/core/assets/glm_ocr_selftest.png${SEP}app/core/assets" \
            --add-data "app/core/assets/licenses/LICENSE-GLM-OCR.txt${SEP}app/core/assets/licenses" \
            --add-data "app/core/assets/licenses/LICENSE-llama.cpp.txt${SEP}app/core/assets/licenses" \
            main.py

      - name: Build single-file .exe (Windows)
        if: runner.os == 'Windows'
        shell: bash
        run: |
          pyinstaller --noconfirm --onefile --windowed --noupx \
            --name inkdoc \
            --icon assets/logo.ico \
            --distpath dist-onefile \
            --collect-all markitdown \
            --collect-all magika \
            --collect-all uvicorn \
            --collect-all fastapi \
            --collect-all webview \
            --collect-all cryptography \
            --collect-all pdfminer \
            --collect-all pdfplumber \
            --collect-all pypdfium2 \
            --collect-data certifi \
            --add-data "app/ui;app/ui" \
            --add-data "assets;assets" \
            --add-data "app/core/manifest.json;app/core" \
            --add-data "app/core/addons.json;app/core" \
            --add-data "app/core/glm_ocr_catalogue.json;app/core" \
            --add-data "app/core/assets/glm_ocr_selftest.png;app/core/assets" \
            --add-data "app/core/assets/licenses/LICENSE-GLM-OCR.txt;app/core/assets/licenses" \
            --add-data "app/core/assets/licenses/LICENSE-llama.cpp.txt;app/core/assets/licenses" \
            main.py

      - name: Sign inner executables (Windows)
        if: runner.os == 'Windows' && env.HAVE_SIGNING == 'true'
        shell: pwsh
        run: |
          Write-Host "Signing inner executables before installer packaging..."
          # Ready for SignPath / Authenticode signing command when secret is set

      - name: Package (Windows zip)
        if: runner.os == 'Windows'
        shell: pwsh
        run: Compress-Archive -Path dist/inkdoc/* -DestinationPath inkdoc-windows.zip

      - name: Build installer with Inno Setup (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          # Inno Setup 6 or 7, wherever the runner image or choco put it: 7.x
          # installs under "Inno Setup 7" (and 64-bit Program Files), so a
          # hard-coded 6.x path would fail the build the day the image moves on.
          $candidates = @(
            "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe",
            "$env:ProgramFiles\Inno Setup 6\ISCC.exe",
            "$env:ProgramFiles\Inno Setup 7\ISCC.exe",
            "${env:ProgramFiles(x86)}\Inno Setup 7\ISCC.exe"
          )
          $iscc = $candidates | Where-Object { Test-Path $_ } | Select-Object -First 1
          if (-not $iscc) {
            choco install innosetup -y --no-progress
            $iscc = $candidates | Where-Object { Test-Path $_ } | Select-Object -First 1
          }
          if (-not $iscc) {
            $iscc = Get-ChildItem $env:ProgramFiles, ${env:ProgramFiles(x86)} -Filter ISCC.exe -Recurse -Depth 2 -ErrorAction SilentlyContinue |
              Select-Object -First 1 -ExpandProperty FullName
          }
          if (-not $iscc) { Write-Error "Inno Setup compiler (ISCC.exe) not found."; exit 1 }
          Write-Host "Using $iscc"
          $version = "${{ steps.ver.outputs.version }}"
          & $iscc "/DMyAppVersion=$version" installer.iss
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Sign installer (Windows)
        if: runner.os == 'Windows' && env.HAVE_SIGNING == 'true'
        shell: pwsh
        run: |
          Write-Host "Signing Inno Setup installer..."
          # Ready for SignPath / Authenticode signing command when secret is set
      # The host's WebKit2GTK can only load against the host's GTK, GLib and libstdc++, so
      # none of them may be bundled (1.2.0's zip broke on every newer distribution this way).
      - name: Use the host's GTK and WebKit (Linux)
        if: runner.os == 'Linux'
        shell: bash
        run: |
          bundle=dist/inkdoc
          echo "Linux bundle before pruning: $(du -sh "$bundle" | cut -f1)"
          python scripts/linux_host_libs.py prune "$bundle/_internal"
          pocketsphinx="$bundle/_internal/speech_recognition/pocketsphinx-data"
          if [ -d "$pocketsphinx" ]; then
            rm -rf -- "$pocketsphinx"
          fi
          python scripts/linux_host_libs.py check "$bundle/_internal"
          echo "Linux bundle after pruning: $(du -sh "$bundle" | cut -f1)"

      # A read-only disk image (lzfse) holding inkdoc.app and a link to /Applications. The
      # script checks the app's signature before packaging and inside the mounted image.
      - name: Package (macOS disk image)
        if: runner.os == 'macOS'
        shell: bash
        run: python scripts/build_dmg.py dist/inkdoc.app inkdoc-macos.dmg

      # Manual runs only, never a tagged release: each compression format's size and mount
      # time, in the job summary, for choosing between them.
      - name: Compare disk image formats (macOS, manual runs)
        if: runner.os == 'macOS' && github.event_name == 'workflow_dispatch'
        continue-on-error: true
        shell: bash
        run: python scripts/build_dmg.py dist/inkdoc.app --compare-formats

      - name: Package (Linux AppImage)
        if: runner.os == 'Linux'
        shell: bash
        run: |
          python scripts/build_appimage.py dist/inkdoc inkdoc-linux-x86_64.AppImage
          echo "Linux AppImage size: $(wc -c < inkdoc-linux-x86_64.AppImage) bytes"

      - name: Stage release artifacts
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path release
          if (Test-Path "inkdoc-${{ matrix.asset_name }}.zip") { Copy-Item "inkdoc-${{ matrix.asset_name }}.zip" release/ }
          if (Test-Path "inkdoc-macos.dmg") { Copy-Item "inkdoc-macos.dmg" release/ }
          if (Test-Path "inkdoc-linux-x86_64.AppImage") { Copy-Item "inkdoc-linux-x86_64.AppImage" release/ }
          if (Test-Path "dist-onefile/inkdoc.exe") { Copy-Item "dist-onefile/inkdoc.exe" release/ }
          if (Test-Path "dist-installer/inkdoc-setup.exe") { Copy-Item "dist-installer/inkdoc-setup.exe" release/ }

      - name: Report staged artifact sizes and digests
        continue-on-error: true
        shell: pwsh
        run: |
          try {
            Write-Host "=== Staged Artifact Sizes & SHA-256 Digests (${{ matrix.asset_name }}) ==="
            $summary = @(
              "### Staged Artifacts (${{ matrix.asset_name }})",
              "",
              "| Name | Bytes | MiB |",
              "| :--- | :--- | :--- |"
            )
            $hashes = @()
            Get-ChildItem -Path release -File | ForEach-Object {
              $bytes = $_.Length
              $mib = "{0:N2}" -f ($bytes / 1MB)
              $hash = (Get-FileHash -Path $_.FullName -Algorithm SHA256).Hash.ToLower()
              Write-Host "$($_.Name): $bytes bytes | SHA-256: $hash"
              $summary += "| ``$($_.Name)`` | $bytes | $mib |"
              $hashes += "$hash  $($_.Name)"
            }
            if ($env:GITHUB_STEP_SUMMARY) {
              $summary += ""
              $summary += "<details><summary>SHA-256 Checksums</summary>"
              $summary += ""
              $summary += "``````"
              $summary += $hashes
              $summary += "``````"
              $summary += "</details>"
              $summary += ""
              $summary | Out-File -FilePath $env:GITHUB_STEP_SUMMARY -Append -Encoding utf8
            }
          } catch {
            Write-Warning "Failed to report artifact sizes: $_"
          }

      - name: Install smoke test document generators
        run: |
          pip install python-docx==1.1.2 openpyxl==3.1.5 fpdf2==2.8.2

      - name: Smoke-test Windows artifacts (installer, onefile, zip)
        if: runner.os == 'Windows'
        shell: bash
        run: |
          python scripts/smoke_test_artifact.py --artifact release/inkdoc-setup.exe --type installer --expected-version "${{ steps.ver.outputs.version }}"
          python scripts/smoke_test_artifact.py --artifact release/inkdoc.exe --type onefile --expected-version "${{ steps.ver.outputs.version }}"
          python scripts/smoke_test_artifact.py --artifact release/inkdoc-windows.zip --type zip --expected-version "${{ steps.ver.outputs.version }}"

      # Mounted read-only, the app copied out of it (as a user drags it), then run from there.
      - name: Smoke-test macOS disk image artifact
        if: runner.os == 'macOS'
        shell: bash
        run: |
          python scripts/smoke_test_artifact.py --artifact release/inkdoc-macos.dmg --type dmg --expected-version "${{ steps.ver.outputs.version }}"

      # The GUI path (a window under Xvfb, checked to have drawn something) with
      # APPIMAGE_EXTRACT_AND_RUN, then once more through the FUSE mount when the runner has it.
      # Inside its own session bus, as a desktop login provides: GTK registers the app on the
      # session bus before it creates the window, and the runner's own bus never answers, so
      # without one no window ever appears (a plain WebKitGTK window neither). The
      # linux-compat containers have no session bus at all, which GTK handles.
      - name: Smoke-test Linux AppImage artifact
        if: runner.os == 'Linux'
        shell: bash
        run: |
          appimage="release/inkdoc-linux-x86_64.AppImage"
          dbus-run-session -- xvfb-run -a -s "-screen 0 1400x900x24" python scripts/smoke_test_artifact.py \
            --artifact "$appimage" --type appimage --expected-version "${{ steps.ver.outputs.version }}"
          if [ -e /dev/fuse ] && command -v fusermount3 >/dev/null; then
            dbus-run-session -- xvfb-run -a -s "-screen 0 1400x900x24" python scripts/smoke_test_artifact.py \
              --artifact "$appimage" --type appimage --appimage-fuse \
              --expected-version "${{ steps.ver.outputs.version }}"
          else
            echo "No FUSE on this runner; the mount path was not tested."
          fi

      - name: Enforce artifact size limits
        shell: pwsh
        run: |
          # Baselines are the measured sizes of the first 1.3.0 CI builds (2026-11-01:
          # Python 3.14.9, docling-pack-v2's manifest). Caps are baseline + 6%, so a real
          # regression trips the guard while normal drift does not. Re-measure after each
          # release rather than letting these go stale: the caps before 1.0.3 were still set
          # against v1.0.1 and left 1.4 MB of headroom on the macOS zip, which the engine
          # manifest alone would have exceeded.
          $limits = @{
            "inkdoc-linux-x86_64.AppImage" = @{ Baseline = 114592248; Cap = 121467782 }
            "inkdoc-macos.dmg" = @{ Baseline = 126395086; Cap = 133978791 }
            "inkdoc-windows.zip" = @{ Baseline = 130769445; Cap = 138615611 }
            "inkdoc.exe" = @{ Baseline = 128009645; Cap = 135690223 }
            "inkdoc-setup.exe" = @{ Baseline = 98410266; Cap = 104314881 }
          }
          if ($env:RUNNER_OS -eq "Linux") {
            $names = @("inkdoc-linux-x86_64.AppImage")
          } elseif ($env:RUNNER_OS -eq "macOS") {
            $names = @("inkdoc-macos.dmg")
          } else {
            $names = @("inkdoc-windows.zip", "inkdoc.exe", "inkdoc-setup.exe")
          }
          foreach ($name in $names) {
            $path = Join-Path "release" $name
            $bytes = (Get-Item $path).Length
            $baseline = $limits[$name].Baseline
            $cap = $limits[$name].Cap
            $change = (($bytes - $baseline) / $baseline) * 100
            Write-Host ("{0}: {1} bytes; change vs expected baseline: {2:N2}%; cap: {3} bytes" -f $name, $bytes, $change, $cap)
            if ($bytes -gt $cap) {
              Write-Error "$name exceeds its size cap of $cap bytes."
              exit 1
            }
          }

      - name: Report Linux bundle size diagnostics
        if: runner.os == 'Linux'
        shell: bash
        run: |
          mkdir -p smoke-logs
          report=smoke-logs/linux-bundle-size.txt
          {
            echo "Linux bundle size diagnostics"
            echo "=== 40 largest files/directories in dist/inkdoc ==="
            du -ah dist/inkdoc | sort -rh > /tmp/du.txt || true
            head -40 /tmp/du.txt || true
            echo "=== Selected top-level bundle directories/files ==="
            find dist/inkdoc -maxdepth 2 \( -path '*/_internal/gi*' -o -path '*/_internal/gi_repository' -o -path '*/_internal/typelibs' -o -path '*/_internal/webkit*' -o -path '*/_internal/gtk*' -o -path '*/_internal/libicu*' -o -path '*/_internal/libLLVM*' -o -path '*/_internal/onnx*' -o -path '*/_internal/torch*' -o -path '*/_internal/cuda*' \) -print0 | xargs -0 -r du -sh
          } > "$report" || true
          cat "$report" || true
          if [ -n "${GITHUB_STEP_SUMMARY:-}" ]; then
            {
              echo "### Linux bundle size diagnostics"
              echo
              echo '```text'
              cat "$report"
              echo '```'
            } >> "$GITHUB_STEP_SUMMARY"
          fi

      - name: Upload smoke test logs
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: smoke-logs-${{ matrix.asset_name }}
          path: smoke-logs/*
          if-no-files-found: ignore

      - name: Generate SHA-256 checksums
        shell: pwsh
        working-directory: release
        run: |
          Get-ChildItem -File | Where-Object { $_.Name -notlike "SHA256SUMS*" } | ForEach-Object {
            $hash = (Get-FileHash -Path $_.FullName -Algorithm SHA256).Hash.ToLower()
            "$hash  $($_.Name)"
          } | Set-Content -Encoding ascii -Path "SHA256SUMS-${{ matrix.asset_name }}.txt"

      - name: Attest build provenance
        uses: actions/attest-build-provenance@e8998f949152b193b063cb0ec769d69d929409be # v2.2.0
        with:
          subject-path: release/*

      - name: Upload build artifacts (workflow_dispatch or tag)
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: inkdoc-build-${{ matrix.asset_name }}
          path: release/*

      - name: Upload artifacts to GitHub Draft Release
        if: startsWith(github.ref, 'refs/tags/v')
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
        run: |
          TAG="${{ github.ref_name }}"
          echo "Verifying that release '$TAG' is still a draft before uploading..."
          IS_DRAFT=$(gh release view "$TAG" -R "${{ github.repository }}" --json isDraft -q .isDraft)
          if [ "$IS_DRAFT" != "true" ]; then
            echo "::error::Release '$TAG' is not a draft (isDraft=$IS_DRAFT). Refusing to upload or clobber."
            exit 1
          fi
          echo "Uploading release artifacts to draft release $TAG..."
          gh release upload "$TAG" -R "${{ github.repository }}" release/* --clobber

  # The AppImage relies on the user's own GTK and WebKit2GTK. The build host is only one
  # distribution, so run the same smoke test (window included) on others, with nothing but
  # what a user installs: the distribution's WebKit2GTK 4.1 and its typelibs.
  linux-compat:
    name: Linux compatibility (${{ matrix.image }})
    needs: [build]
    if: ${{ !failure() && !cancelled() }}
    runs-on: ubuntu-24.04
    container: ${{ matrix.image }}
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        include:
          - image: ubuntu:24.04
            family: deb
          - image: debian:13
            family: deb
          - image: fedora:44
            family: fedora
    steps:
      - name: Install the distribution's WebKit2GTK, Xvfb and Python
        run: |
          if [ "${{ matrix.family }}" = deb ]; then
            apt-get update
            DEBIAN_FRONTEND=noninteractive apt-get install -y --no-install-recommends \
              ca-certificates python3 python3-venv xvfb xauth x11-apps \
              gir1.2-gtk-3.0 gir1.2-webkit2-4.1 fonts-dejavu-core
          else
            # gobject-introspection carries cairo-1.0.typelib, present on every Fedora desktop.
            dnf -y install python3 xorg-x11-server-Xvfb xorg-x11-xauth xwd \
              gtk3 webkit2gtk4.1 gobject-introspection dejavu-sans-fonts
          fi
          getconf GNU_LIBC_VERSION

      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.2.2

      - name: Download the Linux build
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: inkdoc-build-linux
          path: release

      - name: Smoke-test the AppImage
        run: |
          python3 -m venv /tmp/smoke-venv
          /tmp/smoke-venv/bin/pip install python-docx==1.1.2 openpyxl==3.1.5 fpdf2==2.8.2
          xvfb-run -a -s "-screen 0 1400x900x24" /tmp/smoke-venv/bin/python scripts/smoke_test_artifact.py \
            --artifact release/inkdoc-linux-x86_64.AppImage --type appimage \
            --expected-version "${{ needs.build.outputs.version }}"

  publish-release:
    name: Publish Release
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [build, linux-compat]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Verify draft release assets
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
        run: |
          TAG="${{ github.ref_name }}"
          assets=$(gh release view "$TAG" -R "${{ github.repository }}" --json assets -q '.assets[].name')
          # The same names as sign_manifest.py's TARGET_ASSETS plus inkdoc.exe
          # (tests/test_release_assets.py).
          for required in inkdoc-setup.exe inkdoc.exe inkdoc-windows.zip inkdoc-macos.dmg inkdoc-linux-x86_64.AppImage; do
            if ! printf '%s\n' "$assets" | grep -Fxq "$required"; then
              echo "::error::Draft release '$TAG' is missing required asset: $required"
              exit 1
            fi
          done
          echo "All required draft release assets are present."

      # A stable tag deliberately stops at a draft.
      #
      # The in-app updater fetches
      # /releases/latest/download/inkdoc-update-manifest.json, which GitHub serves
      # only for the release marked Latest. That manifest is signed offline with a
      # key that never touches CI, so it can only be attached after the build has
      # produced the assets to hash. Publishing automatically would therefore make
      # the new release Latest while the manifest it needs does not yet exist, and
      # every install would get HTTP 404 on "Check for updates" -- which is exactly
      # what v1.0.2 did.
      #
      # Pre-releases (any tag containing a hyphen) still publish automatically. They
      # are never Latest, so they cannot affect the updater.
      - name: Stable release stops at a draft for offline signing
        if: ${{ !contains(github.ref_name, '-') }}
        shell: bash
        run: |
          {
            echo "### ${{ github.ref_name }} is waiting to be published"
            echo
            echo "The draft is complete. To finish the release:"
            echo
            echo '1. Verify build provenance:'
            echo '   `gh release download ${{ github.ref_name }} --dir /tmp/r --repo ${{ github.repository }}`'
            echo '   `for f in /tmp/r/*; do gh attestation verify "$f" --repo ${{ github.repository }}; done`'
            echo '2. Sign the update manifest offline:'
            echo '   `python scripts/sign_manifest.py --tag ${{ github.ref_name }}`'
            echo '3. Confirm `inkdoc-update-manifest.json` is attached to the draft.'
            echo '4. Publish the draft with **Set as the latest release** checked.'
            echo
            echo 'Step 4 matters: the updater resolves /releases/latest/download/, so a'
            echo 'release that is published without being marked Latest still 404s.'
          } >> "$GITHUB_STEP_SUMMARY"
          echo "Stable release '${{ github.ref_name }}' left as a draft. See the job summary for the signing handoff."

      - name: Publish pre-release
        if: ${{ contains(github.ref_name, '-') }}
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
        run: |
          TAG="${{ github.ref_name }}"
          echo "Publishing pre-release: $TAG"
          gh release edit "$TAG" -R "${{ github.repository }}" --draft=false --prerelease
          gh release view "$TAG" -R "${{ github.repository }}" --json isDraft,isPrerelease,assets
