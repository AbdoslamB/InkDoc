<svg xmlns="http://www.w3.org/2000/svg" width="400" height="96" viewBox="0 0 400 96" role="img" aria-label="Download InkDoc for Windows: Portable executable (inkdoc.exe)">
  <title>Download InkDoc for Windows: Portable executable (inkdoc.exe)</title>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#141e29"/>
      <stop offset="1" stop-color="#0b1117"/>
    </linearGradient>
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#10b981"/>
      <stop offset="1" stop-color="#22d3ee"/>
    </linearGradient>
    <radialGradient id="glow" gradientUnits="userSpaceOnUse" cx="44" cy="48" r="170">
      <stop offset="0" stop-color="#10b981" stop-opacity=".17"/>
      <stop offset="1" stop-color="#10b981" stop-opacity="0"/>
    </radialGradient>
    <clipPath id="round"><rect width="400" height="96" rx="14"/></clipPath>
  </defs>

  <g clip-path="url(#round)">
    <rect width="400" height="96" fill="url(#bg)"/>
    <rect width="400" height="96" fill="url(#glow)"/>
    <rect width="400" height="2.5" fill="url(#accent)"/>
  </g>
  <rect x=".5" y=".5" width="399" height="95" rx="13.5" fill="none" stroke="#2b3947"/>

  <!-- platform tile -->
  <rect x="16" y="20" width="56" height="56" rx="14" fill="#182432" stroke="#2f3f50"/>
  <g transform="translate(44 48) scale(1.12) translate(-12 -12)" fill="#eaf1f8"><rect x="2.5" y="2.5" width="8.6" height="8.6" rx=".6"/><rect x="12.9" y="2.5" width="8.6" height="8.6" rx=".6"/><rect x="2.5" y="12.9" width="8.6" height="8.6" rx=".6"/><rect x="12.9" y="12.9" width="8.6" height="8.6" rx=".6"/></g>

  <!-- copy -->
  <text x="88" y="40" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,'Helvetica Neue',Arial,sans-serif" font-size="16" font-weight="600" fill="#f3f7fb">Windows Portable</text>
  <text x="88" y="58" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,'Liberation Mono',monospace" font-size="11.5" fill="#5eead4">inkdoc.exe</text>
  <text x="88" y="76" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,'Helvetica Neue',Arial,sans-serif" font-size="11" fill="#8a99a8">No admin rights needed</text>

