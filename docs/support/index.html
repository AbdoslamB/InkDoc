<!doctype html>
<!--
  InkDoc's support address. Released apps link here, never to a platform
  directly, so the destination can change without an app update. Keep this
  page at /support/ for as long as any released version links to it.
-->
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <meta http-equiv="refresh" content="0; url=https://buymeacoffee.com/abdoslamb" />
  <script>location.replace("https://buymeacoffee.com/abdoslamb");</script>
  <meta name="robots" content="noindex" />
  <link rel="canonical" href="https://buymeacoffee.com/abdoslamb" />
  <title>Support InkDoc</title>
  <style>
    :root { color-scheme: light dark; --bg: #f7f7f5; --fg: #1d1d1f; --link: #b4232c; }
    @media (prefers-color-scheme: dark) { :root { --bg: #0e0e10; --fg: #e8e8ea; --link: #ff6b74; } }
    body { margin: 0; min-height: 100vh; display: grid; place-items: center; background: var(--bg);
           color: var(--fg); font: 15px/1.5 system-ui, -apple-system, "Segoe UI", sans-serif; }
    p { margin: 0 16px; text-align: center; }
    a { color: var(--link); }
  </style>
</head>
<body>
  <p>Taking you to <a href="https://buymeacoffee.com/abdoslamb">Buy Me a Coffee</a>…</p>
</body>
</html>
