[tool.ruff]
target-version = "py310"
line-length = 100

[tool.ruff.lint]
select = [
    "E",   # pycodestyle errors
    "W",   # pycodestyle warnings
    "F",   # pyflakes
    "I",   # isort
    "UP",  # pyupgrade
    "B",   # flake8-bugbear
    "SIM", # flake8-simplify
]
ignore = [
    "E402",    # Module level import not at top of file (sys.path / warning filters before imports)
    "B008",    # Do not perform function call in argument defaults (FastAPI File/Query pattern)
    "E501",    # Line too long
    "SIM105",  # Use contextlib.suppress
]

